name: Deploy preview
run-name: Deploy ${{ github.ref_name }} to preview

on: workflow_dispatch

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Test
        run: pnpm test

      - name: Build for preview
        env:
          CLOUDFLARE_ENV: preview
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [[ -n "$VITE_STRIPE_PUBLISHABLE_KEY" && "$VITE_STRIPE_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo "::error::PREVIEW_STRIPE_PUBLISHABLE_KEY must be a Stripe test key."
            exit 1
          fi
          pnpm build
          jq -e '
            .name == "oneforthecity-preview" and
            .workers_dev == true and
            ((.routes // []) | length == 0) and
            (.d1_databases | length == 1) and
            .d1_databases[0].binding == "DB" and
            .d1_databases[0].database_name == "oneforthecity-preview" and
            .d1_databases[0].database_id == null
          ' dist/server/wrangler.json > /dev/null

      - name: Migrate and deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID for preview."
            exit 1
          fi
          database_id=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/oneforthecity-preview" |
            jq -er 'select(.success and .result.name == "oneforthecity-preview") | .result.uuid | select(type == "string" and length > 0)')

          config=dist/server/wrangler.json
          jq --arg id "$database_id" '.d1_databases[0].database_id = $id' "$config" > "$config.tmp"
          mv "$config.tmp" "$config"
          pnpm exec wrangler d1 migrations apply oneforthecity-preview --config "$config" --remote

          deploy_output=$(mktemp "$RUNNER_TEMP/wrangler-preview.XXXXXX")
          WRANGLER_OUTPUT_FILE_PATH="$deploy_output" pnpm exec wrangler deploy --config "$config"
          if ! preview_url=$(jq -ers '
            [.[] | select(.type == "deploy" and .worker_name == "oneforthecity-preview") |
             .targets[]? | select(test("^https://oneforthecity-preview\\.[a-z0-9-]+\\.workers\\.dev$"))]
            | last | strings
          ' "$deploy_output"); then
            echo "::error::Wrangler completed the deploy but did not report the preview Worker URL."
            exit 1
          fi

          printf 'url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
          printf '### Preview deployment\n\n[Open preview](%s)\n\nCommit `%s`.\n' \
            "$preview_url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
